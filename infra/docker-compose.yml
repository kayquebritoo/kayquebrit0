# KBOS — stack local e de VPS (web + worker + redis + postgres).
# Uso: docker compose -f infra/docker-compose.yml up -d --build
# O compose lê SEMPRE /opt/kbos/.env (ou ./.env no dev local):
#   docker compose --env-file /opt/kbos/.env -f infra/docker-compose.yml up -d
name: kbos
# Evolution API + banco próprio sob o profile `evolution`:
#   docker compose -f infra/docker-compose.yml --profile evolution up -d

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Postgres local p/ dev. Produção: DATABASE_URL do Neon (serviço ignorado).
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kbos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kbos}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kbos"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        # Build-time (ver Dockerfile): garante defaults mesmo com .env antigo.
        # O `environment` abaixo sempre vence no runtime.
        EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
        EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-kbos-dev-key}
        EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-kbos-primary}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Fotos da galeria do cliente (cópias leves com marca d'água; originais ficam no Drive).
      - gallery-data:/data/gallery
    environment:
      GALLERY_DIR: /data/gallery
      GALLERY_INGEST_TOKEN: ${GALLERY_INGEST_TOKEN:-}
      # Token MCP da mLabs (somente servidor): sincroniza o calendário de Conteúdo.
      MLABS_MCP_TOKEN: ${MLABS_MCP_TOKEN:-}
      # Publicar no Instagram/Facebook (fase 3 do Conteúdo): app da Meta. Vazio = recurso desligado.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      # Redes sociais por cliente (OAuth): chave que cifra os tokens + apps de cada rede. Vazio = rede desligada.
      SOCIAL_TOKEN_KEY: ${SOCIAL_TOKEN_KEY:-}
      GOOGLE_SOCIAL_CLIENT_ID: ${GOOGLE_SOCIAL_CLIENT_ID:-}
      GOOGLE_SOCIAL_CLIENT_SECRET: ${GOOGLE_SOCIAL_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_AUDITED: ${TIKTOK_AUDITED:-0}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_VERSION: ${LINKEDIN_VERSION:-202506}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      GIT_SHA: ${GIT_SHA:-local}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:kbos@db:5432/kbos}
      # "pg" = PostgreSQL convencional (kbos-pg18 na VPS); vazio = Neon HTTP.
      DATABASE_DRIVER: ${DATABASE_DRIVER:-}
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Bypass admin de emergência (/admin/* sem e-mail). Sem ele, inativo.
      KBOS_ADMIN_BYPASS_TOKEN: ${KBOS_ADMIN_BYPASS_TOKEN:-}
      # Lume online (outra VPS): o KBOS só assina o link de entrada do admin.
      LUME_API_TOKEN: ${LUME_API_TOKEN:-}
      LUME_URL: ${LUME_URL:-https://lume.kayquebrito.com.br}
      # Evolution (motor WhatsApp, profile `evolution` abaixo). Defaults com
      # zero-config: URL é o nome do serviço na rede do compose e a instância
      # é a padrão do código (`kbos-primary`). A CHAVE precisa coincidir com
      # `AUTHENTICATION_API_KEY` do serviço `evolution` (mesmo default dev
      # `kbos-dev-key` nos dois lados). Produção: defina chave forte no
      # `/opt/kbos/.env` e recrie (`up -d --build`) — ver aviso na UI.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-kbos-dev-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-kbos-primary}
      # Inbox Fase 2: segredo do webhook inbound (vazio = aceita sem segredo).
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      # Canais Fase 2b: Telegram via Bot API.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Campanhas Fase 3 (pacing visto pela API na estimativa de duração).
      CAMPAIGN_SEND_DELAY_MS: ${CAMPAIGN_SEND_DELAY_MS:-8000}
      # Assistente IA Fase 3 (sem OPENAI_API_KEY = modo base/stub).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TTS_MODEL: ${AI_TTS_MODEL:-tts-1}
      AI_TTS_VOICE: ${AI_TTS_VOICE:-alloy}
      ASSISTANT_SYSTEM_PROMPT: ${ASSISTANT_SYSTEM_PROMPT:-}
      # Provedores trocáveis (cérebro / ouvido / voz) — ver lib/kbos/assistant.ts.
      # Configure com: bash /opt/kbos/scripts/kbos-config.sh
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      ASSISTANT_TRIGGER: ${ASSISTANT_TRIGGER:-}
      ASSISTANT_OWNER_PHONE: ${ASSISTANT_OWNER_PHONE:-}
      RATE_AI_MIN: ${RATE_AI_MIN:-20}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      # Liveness pura (sempre 200 com o servidor de pé). NÃO usar /api/health
      # aqui: ele retorna 503 quando db/redis caem e prenderia o container em
      # `unhealthy` por causa de downstream (foi a causa do 502 no Caddy).
      # 127.0.0.1 (não `localhost`): o wget resolve localhost p/ ::1 (IPv6)
      # e o Next standalone escuta só em IPv4 — connection refused.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--timeout=3", "--spider", "http://127.0.0.1:3000/api/health/live/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
        EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-kbos-dev-key}
        EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-kbos-primary}
    command: ["npx", "tsx", "worker/index.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:kbos@db:5432/kbos}
      # "pg" = PostgreSQL convencional (kbos-pg18 na VPS); vazio = Neon HTTP.
      DATABASE_DRIVER: ${DATABASE_DRIVER:-}
      REDIS_URL: redis://redis:6379
      # Mesmos defaults do `web` (ver comentário lá): zero-config no compose.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-kbos-dev-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-kbos-primary}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_SWEEP_MS: ${WORKER_SWEEP_MS:-30000}
      WORKER_CRON_MS: ${WORKER_CRON_MS:-3600000}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_BASE_DELAY_MS: ${JOB_BASE_DELAY_MS:-5000}
      BRIEFING_FOLLOWUP_HOURS: ${BRIEFING_FOLLOWUP_HOURS:-48}
      # Campanhas Fase 3: intervalo base entre envios (anti-banimento).
      CAMPAIGN_SEND_DELAY_MS: ${CAMPAIGN_SEND_DELAY_MS:-8000}
      # Agenda Fase 4: destino, cadência da varredura e tolerância.
      REMINDER_WHATSAPP_TO: ${REMINDER_WHATSAPP_TO:-}
      REMINDER_POLL_MS: ${REMINDER_POLL_MS:-300000}
      REMINDER_CATCHUP_MIN: ${REMINDER_CATCHUP_MIN:-60}
      # Monitor do WhatsApp (aviso de queda por e-mail e, opcional, Telegram).
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # Publicar no Instagram/Facebook (fase 3 do Conteúdo): app da Meta. Vazio = recurso desligado.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      # Redes sociais por cliente (OAuth): chave que cifra os tokens + apps de cada rede. Vazio = rede desligada.
      SOCIAL_TOKEN_KEY: ${SOCIAL_TOKEN_KEY:-}
      GOOGLE_SOCIAL_CLIENT_ID: ${GOOGLE_SOCIAL_CLIENT_ID:-}
      GOOGLE_SOCIAL_CLIENT_SECRET: ${GOOGLE_SOCIAL_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_AUDITED: ${TIKTOK_AUDITED:-0}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_VERSION: ${LINKEDIN_VERSION:-202506}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Evolution API (motor WhatsApp) — profile `evolution` ---
  evo-db:
    image: postgres:15-alpine
    profiles: ["evolution"]
    environment:
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD:-evolution}
    volumes:
      - evo-data:/var/lib/postgresql/data
    restart: unless-stopped

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["evolution"]
    ports:
      - "${EVO_PORT:-8080}:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-kbos-dev-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: postgres://postgres:${EVO_DB_PASSWORD:-evolution}@evo-db:5432/evolution
      # A v2 lê CACHE_REDIS_*; sem isso ela tenta um Redis vazio e fica em
      # "redis disconnected" em loop (o que trava o recebimento de mensagens).
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Guarda as mensagens na Evolution: o KBOS baixa fotos/áudios/vídeos
      # por elas (getBase64FromMediaMessage precisa achar a mensagem salva).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Sem DEBUG: nesse nível a Evolution grava o payload inteiro (com a apikey) no log.
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
    depends_on:
      - redis
      - evo-db
    restart: unless-stopped

  # Ouvido do assistente (opcional): Whisper local, padrão OpenAI, só CPU.
  # Liga uma vez com `--profile voz`; no .env: STT_BASE_URL=http://whisper:8000/v1
  # e STT_MODEL=Systran/faster-whisper-small. Limitado a 1,5 núcleo para não
  # roubar a VPS do KBOS (são só 2).
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: ["voz"]
    environment:
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    cpus: "1.5"
    mem_limit: 2g
    restart: unless-stopped

volumes:
  gallery-data:
  whisper-models:
  redis-data:
  pg-data:
  evo-data:
