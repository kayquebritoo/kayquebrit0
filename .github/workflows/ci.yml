# CI — tipos, lint e testes em todo push (inclusive branches de trabalho).
# O deploy continua no deploy-vps.yml; este workflow só valida.
name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos (tsc)
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Testes
        # github-actions: falhas viram anotações (legíveis sem baixar o log)
        run: npx vitest run --reporter=default --reporter=github-actions
